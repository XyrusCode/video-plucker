[package]
name = "yt-plucker"
version = "3.0.0"
description = "Xyrus' YT Plucker - pluck videos from YouTube, X (Twitter) and streaming sites"
authors = ["Prince Shammah"]
edition = "2021"

[lib]
name = "yt_plucker_lib"
# Desktop-only: rlib is all the bin needs. The staticlib/cdylib crate-types
# (for mobile) build a DLL that auto-exports every symbol and blows past PE's
# 65535-export limit under the GNU/LLD linker.
crate-type = ["rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "image-png"] }
tauri-plugin-shell = "2"
tauri-plugin-dialog = "2"
tauri-plugin-store = "2"
tauri-plugin-single-instance = "2"
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Streaming-site extractors: HTTP client for the site APIs. rustls-tls avoids an
# OpenSSL build dep so the Windows/GNU + NSIS pipeline stays self-contained.
# (HTML scraping via `scraper` will be added when luciferdonghua is implemented.)
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "gzip"] }
async-trait = "0.1"
