name: Release

# Version-driven releases. The Rune build has no Tauri bundler, so each
# matrix leg builds with cargo and assembles its own installer. `check`
# keeps version numbers single-use; `publish` creates one shared release
# and a `latest.json` for the in-app updater; `mirror` copies assets to R2.

on:
  push:
    branches:
      - main
    paths:
      - src-tauri/Cargo.toml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  check:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.resolve.outputs.version }}
      release: ${{ steps.resolve.outputs.release }}
    steps:
      - uses: actions/checkout@v4

      - name: Resolve version and whether it needs releasing
        id: resolve
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          version=$(grep -m1 '^version = ' src-tauri/Cargo.toml | cut -d'"' -f2)
          echo "version=$version" >> "$GITHUB_OUTPUT"
          highest=$(gh release list --limit 100 --json tagName --jq '.[].tagName' | sed 's/^v//' | sort -V | tail -1)
          if [ -n "$highest" ] && [ "$version" != "$highest" ] && [ "$(printf '%s\n%s\n' "$version" "$highest" | sort -V | tail -1)" = "$highest" ]; then
            echo "::error::Version $version is not above the latest release ($highest). A version number is used once: pick a higher one."
            exit 1
          fi
          if gh release view "v$version" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "release=false" >> "$GITHUB_OUTPUT"
            echo "Release v$version already exists — nothing to do."
          else
            echo "release=true" >> "$GITHUB_OUTPUT"
            echo "New version v$version — a release will be built."
          fi

  build:
    needs: check
    if: needs.check.outputs.release == 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            asset: video-plucker_${VERSION}_x64-setup.exe
          - os: macos-15-intel
            asset: video-plucker_${VERSION}_x64.dmg
          - os: ubuntu-24.04
            asset: video-plucker_${VERSION}_amd64.deb
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libxkbcommon-dev libwayland-dev libxkbcommon-x11-0 libvulkan1 vulkan-tools patchelf

      - name: Install Rust (stable)
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: .

      - name: Download sidecars (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force binaries | Out-Null
          Invoke-WebRequest "https://github.com/yt-dlp/yt-dlp/releases/latest/download/yt-dlp.exe" -OutFile "binaries/yt-dlp.exe"
          Invoke-WebRequest "https://github.com/BtbN/FFmpeg-Builds/releases/latest/download/ffmpeg-master-latest-win64-lgpl.zip" -OutFile "$env:RUNNER_TEMP/ffmpeg.zip"
          Expand-Archive "$env:RUNNER_TEMP/ffmpeg.zip" -DestinationPath "$env:RUNNER_TEMP/ffmpeg" -Force
          Copy-Item (Get-ChildItem "$env:RUNNER_TEMP/ffmpeg" -Recurse -Filter ffmpeg.exe | Select-Object -First 1).FullName "binaries/ffmpeg.exe"

      - name: Download sidecars (macOS)
        if: runner.os == 'macOS'
        run: |
          mkdir -p binaries
          curl -fL --retry 5 --retry-all-errors "https://github.com/yt-dlp/yt-dlp/releases/latest/download/yt-dlp_macos" -o binaries/yt-dlp
          curl -fL --retry 5 --retry-all-errors "https://github.com/eugeneware/ffmpeg-static/releases/latest/download/ffmpeg-darwin-x64" -o binaries/ffmpeg
          chmod +x binaries/yt-dlp binaries/ffmpeg

      - name: Download sidecars (Linux)
        if: runner.os == 'Linux'
        run: |
          mkdir -p binaries
          curl -fL --retry 5 --retry-all-errors "https://github.com/yt-dlp/yt-dlp/releases/latest/download/yt-dlp_linux" -o binaries/yt-dlp
          curl -fL --retry 5 --retry-all-errors "https://github.com/BtbN/FFmpeg-Builds/releases/latest/download/ffmpeg-master-latest-linux64-lgpl.tar.xz" -o "$RUNNER_TEMP/ffmpeg.tar.xz"
          mkdir -p "$RUNNER_TEMP/ffmpeg"
          tar -xf "$RUNNER_TEMP/ffmpeg.tar.xz" -C "$RUNNER_TEMP/ffmpeg"
          cp "$(find "$RUNNER_TEMP/ffmpeg" -type f -name ffmpeg | head -1)" binaries/ffmpeg
          chmod +x binaries/yt-dlp binaries/ffmpeg

      - name: Build
        run: cargo build --release

      - name: Stage payload
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          if [ "$RUNNER_OS" = "Windows" ]; then
            cp target/release/yt-plucker.exe dist/
            cp binaries/yt-dlp.exe binaries/ffmpeg.exe dist/
          else
            cp target/release/yt-plucker dist/
            cp binaries/yt-dlp binaries/ffmpeg dist/
          fi
          cp -R src-tauri/yt-dlp-plugins dist/

      - name: Package (Windows NSIS)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          choco install nsis -y --no-progress
          $makensis = "C:\Program Files (x86)\NSIS\makensis.exe"
          if (-not (Test-Path $makensis)) { $makensis = "C:\Program Files\NSIS\makensis.exe" }
          & $makensis "/DVERSION=${{ needs.check.outputs.version }}" "/DBIN=$(Resolve-Path dist)" "/DOUT=video-plucker_${{ needs.check.outputs.version }}_x64-setup.exe" scripts/installer.nsi
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Package (macOS dmg)
        if: runner.os == 'macOS'
        shell: bash
        run: |
          set -euo pipefail
          version="${{ needs.check.outputs.version }}"
          app="dist/Video Plucker.app"
          mkdir -p "$app/Contents/MacOS"
          cp target/release/yt-plucker "$app/Contents/MacOS/"
          cp binaries/yt-dlp binaries/ffmpeg "$app/Contents/MacOS/"
          cp -R src-tauri/yt-dlp-plugins "$app/Contents/MacOS/"
          cat > "$app/Contents/Info.plist" <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0"><dict>
            <key>CFBundleName</key><string>Video Plucker</string>
            <key>CFBundleDisplayName</key><string>Video Plucker</string>
            <key>CFBundleExecutable</key><string>yt-plucker</string>
            <key>CFBundleIdentifier</key><string>tech.xyruscode.videoplucker</string>
            <key>CFBundleVersion</key><string>$version</string>
            <key>CFBundleShortVersionString</key><string>$version</string>
            <key>CFBundlePackageType</key><string>APPL</string>
            <key>LSMinimumSystemVersion</key><string>11.0</string>
            <key>CFBundleURLTypes</key><array><dict>
              <key>CFBundleURLName</key><string>tech.xyruscode.videoplucker</string>
              <key>CFBundleURLSchemes</key><array><string>yt-plucker</string></array>
            </dict></array>
          </dict></plist>
          EOF
          codesign --force --deep --sign - "$app"
          hdiutil create -volname "Video Plucker" -srcfolder "$app" -ov -format UDZO "video-plucker_${version}_x64.dmg"

      - name: Package (Linux deb)
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -euo pipefail
          version="${{ needs.check.outputs.version }}"
          root="pkg"
          mkdir -p "$root/DEBIAN" "$root/usr/bin" "$root/usr/share/applications"
          cp target/release/yt-plucker binaries/yt-dlp binaries/ffmpeg "$root/usr/bin/"
          cp -R src-tauri/yt-dlp-plugins "$root/usr/bin/"
          cp scripts/yt-plucker.desktop "$root/usr/share/applications/"
          cat > "$root/DEBIAN/control" <<EOF
          Package: video-plucker
          Version: $version
          Section: utils
          Priority: optional
          Architecture: amd64
          Maintainer: Prince Shammah <support@xyruscode.com>
          Description: Video Plucker
           Download videos from YouTube, X, TikTok and streaming sites.
          EOF
          dpkg-deb --build "$root" "video-plucker_${version}_amd64.deb"

      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: installer-${{ runner.os }}
          path: |
            *.exe
            *.dmg
            *.deb
          if-no-files-found: error

  publish:
    needs: [check, build]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Extract release notes
        id: notes
        run: |
          version="${{ needs.check.outputs.version }}"
          body=$(awk -v v="$version" '
            BEGIN { found = 0 }
            /^## \[/ {
              if (found) exit
              if ($0 ~ ("^## \\[" v "\\]")) { found = 1; next }
            }
            found { print }
          ' CHANGELOG.md)
          if [ -z "$body" ]; then body="No release notes available for v$version."; fi
          {
            echo "body<<EOF"
            echo "$body"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Build updater manifest
        id: manifest
        run: |
          set -euo pipefail
          version="${{ needs.check.outputs.version }}"
          base="https://github.com/${GITHUB_REPOSITORY}/releases/download/v${version}"
          win="video-plucker_${version}_x64-setup.exe"
          mac="video-plucker_${version}_x64.dmg"
          lin="video-plucker_${version}_amd64.deb"
          win_sha=$(sha256sum "dist/$win" | cut -d' ' -f1)
          mac_sha=$(sha256sum "dist/$mac" | cut -d' ' -f1)
          lin_sha=$(sha256sum "dist/$lin" | cut -d' ' -f1)
          jq -n \
            --arg v "$version" --arg base "$base" \
            --arg win "$win" --arg mac "$mac" --arg lin "$lin" \
            --arg ws "$win_sha" --arg ms "$mac_sha" --arg ls "$lin_sha" \
            '{
              version: $v,
              notes: "Video Plucker " + $v,
              platforms: {
                "windows-x86_64": { signature: "", checksum: $ws, url: ($base + "/" + $win) },
                "darwin-x86_64":  { signature: "", checksum: $ms, url: ($base + "/" + $mac) },
                "linux-x86_64":   { signature: "", checksum: $ls, url: ($base + "/" + $lin) }
              }
            }' > dist/latest.json
          echo "wrote dist/latest.json"

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "v${{ needs.check.outputs.version }}" \
            --repo "$GITHUB_REPOSITORY" \
            --title "Video Plucker v${{ needs.check.outputs.version }}" \
            --notes "${{ steps.notes.outputs.body }}" \
            dist/*

  mirror:
    needs: [publish, check]
    if: always() && needs.check.outputs.release == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Download release assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p dist
          gh release download "v${{ needs.check.outputs.version }}" \
            --repo "$GITHUB_REPOSITORY" \
            --dir dist

      - name: Upload to Cloudflare R2
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          npm install -g wrangler
          for f in dist/*; do
            wrangler r2 object put "video-plucker-releases/desktop/v${{ needs.check.outputs.version }}/$(basename "$f")" --file "$f" --remote
          done
