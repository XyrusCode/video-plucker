name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows-latest
            triple: x86_64-pc-windows-msvc
            bundles: nsis
          - platform: macos-13
            triple: x86_64-apple-darwin
            bundles: dmg
          - platform: ubuntu-22.04
            triple: x86_64-unknown-linux-gnu
            bundles: deb

    runs-on: ${{ matrix.platform }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            librsvg2-dev \
            libayatana-appindicator3-dev \
            libssl-dev \
            libsoup-3.0-dev \
            patchelf \
            build-essential

      - name: Install Rust (stable)
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Download sidecars (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $bin = "src-tauri/binaries"
          New-Item -ItemType Directory -Force $bin | Out-Null
          Invoke-WebRequest `
            -Uri "https://github.com/yt-dlp/yt-dlp/releases/latest/download/yt-dlp.exe" `
            -OutFile "$bin/yt-dlp-${{ matrix.triple }}.exe"
          Invoke-WebRequest `
            -Uri "https://github.com/BtbN/FFmpeg-Builds/releases/latest/download/ffmpeg-master-latest-win64-lgpl.zip" `
            -OutFile "$env:RUNNER_TEMP/ffmpeg.zip"
          Expand-Archive "$env:RUNNER_TEMP/ffmpeg.zip" -DestinationPath "$env:RUNNER_TEMP/ffmpeg" -Force
          $ff = (Get-ChildItem "$env:RUNNER_TEMP/ffmpeg" -Recurse -Filter ffmpeg.exe | Select-Object -First 1).FullName
          Copy-Item $ff "$bin/ffmpeg-${{ matrix.triple }}.exe"
          Get-ChildItem $bin

      - name: Download sidecars (macOS)
        if: runner.os == 'macOS'
        run: |
          bin="src-tauri/binaries"
          mkdir -p "$bin"
          # yt-dlp: universal macOS binary
          curl -fL --retry 5 --retry-all-errors \
            "https://github.com/yt-dlp/yt-dlp/releases/latest/download/yt-dlp_macos" \
            -o "$bin/yt-dlp-${{ matrix.triple }}"
          # ffmpeg: static Intel build from evermeet.cx
          curl -fL --retry 5 --retry-all-errors \
            "https://evermeet.cx/ffmpeg/getrelease/ffmpeg/zip" -o "$RUNNER_TEMP/ffmpeg.zip"
          unzip -o "$RUNNER_TEMP/ffmpeg.zip" -d "$RUNNER_TEMP/ffmpeg"
          cp "$RUNNER_TEMP/ffmpeg/ffmpeg" "$bin/ffmpeg-${{ matrix.triple }}"
          chmod +x "$bin/yt-dlp-${{ matrix.triple }}" "$bin/ffmpeg-${{ matrix.triple }}"
          ls -la "$bin"

      - name: Download sidecars (Linux)
        if: runner.os == 'Linux'
        run: |
          bin="src-tauri/binaries"
          mkdir -p "$bin"
          # yt-dlp: x86_64 linux binary
          curl -fL --retry 5 --retry-all-errors \
            "https://github.com/yt-dlp/yt-dlp/releases/latest/download/yt-dlp_linux" \
            -o "$bin/yt-dlp-${{ matrix.triple }}"
          # ffmpeg: static linux64 build from BtbN (GitHub-hosted, LGPL)
          curl -fL --retry 5 --retry-all-errors \
            "https://github.com/BtbN/FFmpeg-Builds/releases/latest/download/ffmpeg-master-latest-linux64-lgpl.tar.xz" \
            -o "$RUNNER_TEMP/ffmpeg.tar.xz"
          mkdir -p "$RUNNER_TEMP/ffmpeg"
          tar -xf "$RUNNER_TEMP/ffmpeg.tar.xz" -C "$RUNNER_TEMP/ffmpeg"
          cp "$(find "$RUNNER_TEMP/ffmpeg" -type f -name ffmpeg | head -1)" "$bin/ffmpeg-${{ matrix.triple }}"
          chmod +x "$bin/yt-dlp-${{ matrix.triple }}" "$bin/ffmpeg-${{ matrix.triple }}"
          ls -la "$bin"

      - name: Build and publish release
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: "Xyrus' YT Plucker ${{ github.ref_name }}"
          releaseBody: |
            Pluck YouTube videos and playlists.

            Download the file for your platform below and install it. yt-dlp and
            ffmpeg are bundled inside the app; no extra setup is required.

            - Windows: `.exe` installer
            - macOS: `.dmg` (unsigned; right-click the app and choose Open on first launch)
            - Linux: `.deb` (Debian/Ubuntu)
          releaseDraft: false
          prerelease: false
          args: --bundles ${{ matrix.bundles }}
