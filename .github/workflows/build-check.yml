name: Build Check

# Quick compile check on PRs and pushes to feature branches.
# Builds the Windows target only; sidecar placeholder binaries are needed
# because tauri_build validates externalBin paths at compile time.

on:
  pull_request:
  workflow_dispatch:

jobs:
  check:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust (stable)
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Download sidecars
        shell: pwsh
        run: |
          $bin = "src-tauri/binaries"
          New-Item -ItemType Directory -Force $bin | Out-Null
          # Placeholder binaries are enough for cargo check — the real ones
          # are only needed at runtime / release packaging.
          "PLACEHOLDER" | Out-File -FilePath "$bin/yt-dlp-x86_64-pc-windows-msvc.exe" -Encoding ascii -NoNewline
          "PLACEHOLDER" | Out-File -FilePath "$bin/ffmpeg-x86_64-pc-windows-msvc.exe" -Encoding ascii -NoNewline
          Get-ChildItem $bin

      - name: Cargo check
        working-directory: src-tauri
        run: cargo check

      - name: Cargo test
        working-directory: src-tauri
        # The Rust unit tests were never wired into CI, so every one of them had been
        # dead weight: cookie matching, failure classification and the dump round-trip
        # would all have failed silently on any PR.
        run: cargo test

  ui-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Playwright smoke test
        # Enforces the shared UI contract in DESIGN.md: design tokens, the element ids
        # main.js dereferences on boot, and that downloads stay inside the Pluck tab.
        run: npx playwright test

      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ui-screenshots
          path: test-results/
          retention-days: 7
