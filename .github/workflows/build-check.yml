name: Build Check

# Quick compile check on PRs and pushes to feature branches.
# Only builds the Windows target since we use Windows-specific
# GNU toolchain features (NSIS installer, sidecar .exe binaries).

on:
  pull_request:
  workflow_dispatch:

jobs:
  check:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust (stable)
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Cargo check
        working-directory: src-tauri
        run: cargo check
