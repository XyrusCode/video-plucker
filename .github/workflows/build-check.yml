name: Build Check

# Rust compile + unit tests, plus Rune's headless UI verification.
# The local GNU toolchain is fragile; CI on windows-latest (MSVC) is the only
# build authority. Never add local cargo steps for verification.

on:
  pull_request:
  workflow_dispatch:

jobs:
  check:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust (stable)
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: .

      - name: Cargo check
        run: cargo check --workspace

      - name: Cargo test
        run: cargo test --workspace

  rune-ui:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust (stable)
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: .

      - name: Render every scene headlessly
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force target/snapshots | Out-Null
          $scenes = @("pluck", "queue", "history", "saved", "search", "settings", "terms", "night-owl")
          foreach ($scene in $scenes) {
            cargo run --quiet -- --snap "target/snapshots/$scene.png" --tree "target/snapshots/$scene.json" --scene $scene
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }

      - name: Upload snapshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rune-ui-snapshots
          path: target/snapshots/
          retention-days: 7
