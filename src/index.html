<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Xyrus' YT Plucker</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <main>
      <header class="chrome">
        <div class="logo">▶</div>
        <h1>Xyrus' YT Plucker</h1>
        <span class="tagline">pluck videos from YouTube, X &amp; streaming sites</span>
        <span id="pair-status" class="pair-status" title="Browser extension not connected">⚬</span>
      </header>

      <nav class="nav-tabs chrome">
        <button id="nav-download" class="nav-tab active">Downloader</button>
        <button id="nav-search" class="nav-tab">Search</button>
      </nav>

      <!-- ============ Downloader view (paste a URL) ============ -->
      <div id="view-download">
        <section class="url-row">
          <input
            id="url-input"
            type="text"
            placeholder="Paste a YouTube or X (Twitter) video or playlist URL…"
            spellcheck="false"
          />
          <label id="playlist-toggle" class="hidden" title="Pluck the whole playlist">
            <input type="checkbox" id="playlist-check" checked />
            Playlist
          </label>
          <button id="analyze-btn" class="glossy-btn">Analyze</button>
        </section>

        <p id="analyze-error" class="error-text hidden"></p>

        <section id="meta-card" class="hidden">
          <img id="meta-thumb" alt="" />
          <div class="meta-info">
            <h2 id="meta-title"></h2>
            <p id="meta-sub"></p>
            <ul id="meta-entries" class="hidden"></ul>
          </div>
        </section>

        <section class="options-row">
          <label class="quality-label">
            Quality
            <select id="quality-select">
              <option value="best">Best available</option>
              <option value="2160">2160p (4K)</option>
              <option value="1440">1440p</option>
              <option value="1080">1080p</option>
              <option value="720">720p</option>
              <option value="480">480p</option>
              <option value="mp3">Audio only — MP3</option>
              <option value="m4a">Audio only — M4A</option>
            </select>
          </label>
          <label class="quality-label" title="Use a browser's login cookies to get past YouTube's bot check">
            YouTube login
            <select id="cookies-select">
              <option value="none">None</option>
              <option value="chrome">Chrome</option>
              <option value="edge">Edge</option>
              <option value="firefox">Firefox</option>
              <option value="brave">Brave</option>
              <option value="opera">Opera</option>
              <option value="vivaldi">Vivaldi</option>
            </select>
          </label>
          <div class="folder-picker">
            <span id="dest-dir" title=""></span>
            <button id="browse-btn" class="glossy-btn">Browse…</button>
          </div>
          <button id="pluck-btn" class="glossy-btn primary" disabled>Pluck</button>
        </section>
      </div>

      <!-- ============ Search view (streaming sites) ============ -->
      <div id="view-search" class="hidden">
        <section class="search-row">
          <select id="site-select" title="Which site to search"></select>
          <input
            id="search-input"
            type="text"
            placeholder="Search a show or movie…"
            spellcheck="false"
          />
          <label class="translation-toggle" title="Subtitled or dubbed">
            <select id="translation-select">
              <option value="sub">Sub</option>
              <option value="dub">Dub</option>
            </select>
          </label>
          <button id="search-btn" class="glossy-btn primary">Search</button>
        </section>

        <p id="search-error" class="error-text hidden"></p>

        <section id="search-results" class="results-grid well hidden"></section>

        <!-- Detail panel for a chosen result -->
        <section id="result-detail" class="hidden">
          <div class="detail-head">
            <img id="detail-poster" alt="" />
            <div class="detail-info">
              <h2 id="detail-title"></h2>
              <p id="detail-sub"></p>
              <button id="detail-back" class="glossy-btn">← Back to results</button>
            </div>
          </div>

          <div class="detail-controls">
            <label class="quality-label">
              Quality
              <select id="stream-quality">
                <option value="best">Best available</option>
                <option value="1080">1080p</option>
                <option value="720">720p</option>
                <option value="480">480p</option>
                <option value="mp3">Audio only — MP3</option>
                <option value="m4a">Audio only — M4A</option>
              </select>
            </label>
            <button id="stream-download" class="glossy-btn primary">Download</button>
          </div>

          <!-- Series-only: season picker + episode batch selection -->
          <div id="series-picker" class="hidden">
            <div class="season-row">
              <label class="quality-label">
                Season
                <select id="season-select"></select>
              </label>
              <input
                id="ep-range"
                type="text"
                placeholder="Range, e.g. 5-12, 15"
                spellcheck="false"
              />
              <button id="ep-select-all" class="glossy-btn">Select all</button>
              <span id="ep-count" class="ep-count"></span>
            </div>
            <ul id="episode-list" class="job-items well"></ul>
          </div>
        </section>
      </div>

      <section id="cookie-manager" class="cookie-manager chrome">
        <div class="cookie-head">
          <span class="cookie-manager-title">Cookie Manager</span>
          <span class="cookie-manager-hint">Import cookies.txt for smoother downloads</span>
        </div>
        <div class="cookie-body">
          <div class="cookie-row">
            <span class="cookie-label">Twitter (X)</span>
            <button id="cookie-twitter" class="glossy-btn cookie-import">Import</button>
            <span id="cookie-twitter-status" class="cookie-status not-loaded">Not loaded</span>
            <button id="cookie-twitter-clear" class="glossy-btn cookie-clear hidden">Clear</button>
          </div>
          <div class="cookie-row">
            <span class="cookie-label">YouTube</span>
            <button id="cookie-youtube" class="glossy-btn cookie-import">Import</button>
            <span id="cookie-youtube-status" class="cookie-status not-loaded">Not loaded</span>
            <button id="cookie-youtube-clear" class="glossy-btn cookie-clear hidden">Clear</button>
          </div>
          <div class="cookie-row">
            <span class="cookie-label">TikTok</span>
            <button id="cookie-tiktok" class="glossy-btn cookie-import">Import</button>
            <span id="cookie-tiktok-status" class="cookie-status not-loaded">Not loaded</span>
            <button id="cookie-tiktok-clear" class="glossy-btn cookie-clear hidden">Clear</button>
          </div>
        </div>
      </section>

      <section id="plucks-head" class="plucks-head">
        <span class="plucks-head-title">Downloads</span>
        <button id="clear-history-btn" class="glossy-btn clear-history">Clear history</button>
      </section>
      <section id="plucks"></section>
    </main>
    <script type="module" src="main.js"></script>
  </body>
</html>
